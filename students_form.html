<html>

    <head> 
        <link rel="stylesheet" type="text/css" href="css/styles.css"/>

    </head>
<body>
    <h1>Student Form</h1>
    <form>

        <label>First Name:</label>
        <input type="text" id="fname" name="fname"><br><br>

        <label>Last Name:</label>
        <input type="text" id="lname" name="lname"><br><br>
   <p> Please choose your gender:   </p>     
        <input type="radio" id="female" name="gender">
        <label> female  </label><br>
        <input type="radio" id="male" name="gender">
        <label> male  </label><br>
        
        <P> Please choose course</P>
        <input type="checkbox" id="java" name="java">
        <label> Java  </label><br>

        <input type="checkbox" id="javascript" name="javascript">
        <label> JavaScript  </label><br>

        <input type="checkbox" id="python" name="python">
        <label> Python  </label><br><br>    

        <button type="submit" id="save">Save</button><br><br>
        <button type="reset" id="reset">Reset</button><br><br>


        <label></label> Choose your country: </label>
            <select name="country">
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
            </select>
        </form>
</body>

</html>
